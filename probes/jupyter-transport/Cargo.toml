[package]
name = "jupyter-transport-probe"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
zeromq = { version = "=0.6.0", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "io-std", "sync"] }
serde_json = "1"
hmac = "=0.13.0"
sha2 = "=0.11.0"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
bytes = "1"
