[package]
name = "jupyter-zmtp-probe"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "io-std", "sync", "net"] }
serde_json = "1"
hmac = "=0.13.0"
sha2 = "=0.11.0"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
