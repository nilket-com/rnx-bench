[package]
name = "column-polars21-step0"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"
[workspace]
[dependencies]
polars-arrow = { git = "file://<WORK_ROOT>/polars", rev = "7f902bd3ffd27ff82d14278a09a295ff2f7aed92", default-features = false }
polars-core = { git = "file://<WORK_ROOT>/polars", rev = "7f902bd3ffd27ff82d14278a09a295ff2f7aed92", default-features = false }
cranelift-codegen = "=0.135.5"
cranelift-frontend = "=0.135.5"
