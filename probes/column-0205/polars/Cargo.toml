cranelift-module = "=0.135.5"
cranelift-native = "=0.135.5"
serde_json = "1"
[build-dependencies]
cc = "1"
[profile.release]
opt-level = 3
codegen-units = 1
lto = false
panic = "unwind"
debug = false
incremental = false
