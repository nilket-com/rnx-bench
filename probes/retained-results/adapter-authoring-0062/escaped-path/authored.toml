# application comment stays byte-for-byte
format = 1
[application]
entry = "main.rn"
[runtime]
path = "../../native \"quote\" \\ 🦀"


[native.polars]
path = '../../native "quote" \ 🦀/adapters/polars'
package = "rnx-polars"
builder = "build"
hook = "plain"

[native.postgres]
path = '../../native "quote" \ 🦀/adapters/postgres'
package = "rnx-postgres"
builder = "build"
hook = "lifecycle"
